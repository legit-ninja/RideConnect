# Phantom Equestrian / RideConnect — production API (FastAPI / uvicorn)

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.phantomequestrian.com

    ErrorLog /var/log/apache2/api.phantomequestrian.com-error_log
    CustomLog /var/log/apache2/api.phantomequestrian.com-access_log combined

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass / http://127.0.0.1:8009/
    ProxyPassReverse / http://127.0.0.1:8009/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    SSLCertificateFile /etc/letsencrypt/live/underdogunlimited.com/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/underdogunlimited.com/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/underdogunlimited.com/chain.pem
</VirtualHost>
</IfModule>
