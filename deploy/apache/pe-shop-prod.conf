# Phantom Equestrian Shop — production (same Next.js process as apex)

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName shop.phantomequestrian.com

    ErrorLog /var/log/apache2/shop.phantomequestrian.com-error_log
    CustomLog /var/log/apache2/shop.phantomequestrian.com-access_log combined

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass / http://127.0.0.1:3009/
    ProxyPassReverse / http://127.0.0.1:3009/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    SSLCertificateFile @DEPLOY_SSL_CERT_FILE@
    SSLCertificateKeyFile @DEPLOY_SSL_CERT_KEY_FILE@
    SSLCertificateChainFile @DEPLOY_SSL_CERT_CHAIN_FILE@
</VirtualHost>
</IfModule>
