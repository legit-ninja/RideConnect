# Phantom Equestrian / RideConnect — dev web (Next.js standalone)

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dev.phantomequestrian.com

    ErrorLog /var/log/apache2/dev.phantomequestrian.com-error_log
    CustomLog /var/log/apache2/dev.phantomequestrian.com-access_log combined

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Block the Next.js image optimizer and the OG image route (RideConnect#7).
    # Keep until a reviewed deploy explicitly decides to remove it; page images
    # do not use /_next/image (images.unoptimized), so only share cards are affected.
    <LocationMatch "^/+(_next/image|api/og)(/|$)">
        Require all denied
    </LocationMatch>
    # disablereuse=On: do not reuse pooled backend connections, so a Node restart
    # does not surface as a one-off 502 from a stale keepalive connection.
    ProxyPass / http://127.0.0.1:3010/ disablereuse=On
    ProxyPassReverse / http://127.0.0.1:3010/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    SSLCertificateFile @DEPLOY_SSL_CERT_FILE@
    SSLCertificateKeyFile @DEPLOY_SSL_CERT_KEY_FILE@
    SSLCertificateChainFile @DEPLOY_SSL_CERT_CHAIN_FILE@
</VirtualHost>
</IfModule>
